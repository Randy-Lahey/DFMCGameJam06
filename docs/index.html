<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFMC Game Jam 06 — Design Docs</title>
<style>
  :root { --ink:#e8e8ef; --dim:#8f92a8; --panel:#1b1c25; --bg:#101018; --line:#2a2b36; --gold:#ffd75e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.65 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
  header { border-bottom:1px solid var(--line); padding:14px 20px; display:flex;
           align-items:baseline; gap:14px; flex-wrap:wrap; }
  header b { letter-spacing:.06em; text-transform:uppercase; font-size:13px; color:var(--dim); }
  header a.play { margin-left:auto; color:var(--gold); text-decoration:none;
                  border:1px solid var(--gold); border-radius:4px; padding:3px 10px; font-size:13px; }
  main { display:flex; gap:0; align-items:flex-start; }
  nav { width:190px; flex:none; border-right:1px solid var(--line); min-height:calc(100vh - 52px); padding:14px 0; }
  nav a { display:block; padding:7px 20px; color:var(--dim); text-decoration:none;
          font-size:14px; border-left:2px solid transparent; cursor:pointer; }
  nav a:hover { color:var(--ink); }
  nav a.on { color:var(--ink); border-left-color:var(--gold); background:#181923; }
  article { padding:24px 32px; max-width:860px; }
  article h1 { font-size:26px; margin:.2em 0 .5em; }
  article h2 { font-size:19px; margin:1.6em 0 .4em; padding-bottom:.25em; border-bottom:1px solid var(--line); }
  article h3 { font-size:15px; margin:1.3em 0 .3em; color:var(--gold); }
  article code { background:#232532; padding:1px 5px; border-radius:3px; font-size:13px; }
  article pre { background:#0d0d12; border:1px solid var(--line); border-radius:4px;
                padding:12px; overflow:auto; }
  article pre code { background:none; padding:0; }
  article table { border-collapse:collapse; margin:.8em 0; font-size:14px; }
  article th, article td { border:1px solid var(--line); padding:5px 10px; text-align:left; }
  article th { background:#232532; font-weight:600; }
  article td.num { text-align:right; font-variant-numeric:tabular-nums; font-family:ui-monospace,monospace; }
  article td.note { color:var(--dim); font-size:13px; }
  article blockquote { border-left:3px solid var(--gold); margin:1em 0; padding:.1em 1em; color:var(--dim); }
  .stamp { color:var(--dim); font-size:13px; margin-bottom:1.4em; }
</style>
</head>
<body>
<header>
  <b>DFMC Game Jam 06</b>
  <span style="color:var(--dim);font-size:13px">design docs &amp; numbers bible</span>
  <a class="play" href="../">▶ Play the build</a>
</header>
<main>
  <nav id="nav"></nav>
  <article id="content">Loading…</article>
</main>

<script src="../data/balance.js"></script>
<!-- vendored (marked v12, MIT) rather than a CDN: the docs must render offline too -->
<script src="marked.min.js"></script>
<script>
const PAGES = [
  { id:'gdd',     label:'GDD',      md:'gdd.md' },
  { id:'numbers', label:'Numbers',  live:true   },
  { id:'devlog',  label:'Dev log',  md:'devlog.md' },
];

const nav = document.getElementById('nav');
const content = document.getElementById('content');

PAGES.forEach(p => {
  const a = document.createElement('a');
  a.textContent = p.label; a.dataset.id = p.id; a.href = '#' + p.id;
  nav.appendChild(a);
});

function renderNumbers() {
  const B = window.BALANCE, N = B.NOTES || {};
  let h = '<h1>Numbers bible</h1><p class="stamp">Rendered live from ' +
          '<code>data/balance.js</code> — the same file the game loads. ' +
          'If a value here is wrong, the game is wrong too. There is no second copy.</p>';

  const table = (title, path, obj) => {
    h += `<h2>${title}</h2><table><tr><th>key</th><th>value</th><th>why</th></tr>`;
    for (const k in obj) {
      const v = obj[k];
      const note = N[path + '.' + k] || '';
      h += `<tr><td><code>${k}</code></td><td class="num">${
        Array.isArray(v) ? v.join(', ') : v}</td><td class="note">${note}</td></tr>`;
    }
    h += '</table>';
  };

  table('Dungeon shape', 'map', B.map);

  h += '<h2>Actors</h2><table><tr><th>kind</th><th>name</th><th>HP</th><th>ATK</th><th>DEF</th>' +
       '<th>hits to kill Hero</th><th>Hero hits to kill</th></tr>';
  const hero = B.actors.hero;
  for (const k in B.actors) {
    const a = B.actors[k];
    const dmgToHero = Math.max(B.combat.minDamage, a.atk - hero.def);
    const dmgFromHero = Math.max(B.combat.minDamage, hero.atk - a.def);
    h += `<tr><td><code>${k}</code></td><td>${a.name}</td>` +
         `<td class="num">${a.hp}</td><td class="num">${a.atk}</td><td class="num">${a.def}</td>` +
         `<td class="num">${k === 'hero' ? '—' : Math.ceil(hero.hp / dmgToHero)}</td>` +
         `<td class="num">${k === 'hero' ? '—' : Math.ceil(a.hp / dmgFromHero)}</td></tr>`;
  }
  h += '</table><p class="stamp">Last two columns are computed, not typed. ' +
       'They are the numbers that actually decide whether a fight feels fair.</p>';

  table('Combat', 'combat', B.combat);
  table('AI', 'ai', B.ai);
  table('Spawning', 'spawns', B.spawns);
  table('Presentation', 'render', B.render);
  content.innerHTML = h;
}

async function show(id) {
  const p = PAGES.find(x => x.id === id) || PAGES[0];
  [...nav.children].forEach(a => a.classList.toggle('on', a.dataset.id === p.id));
  if (p.live) return renderNumbers();
  try {
    const r = await fetch(p.md);
    if (!r.ok) throw new Error(r.status);
    content.innerHTML = marked.parse(await r.text());
  } catch (e) {
    content.innerHTML = `<h1>${p.label}</h1><p class="stamp">Couldn't load <code>${p.md}</code>` +
      ` (${e.message}). Markdown is fetched, which needs a web server — this page works on ` +
      `GitHub Pages, or locally via <code>python -m http.server</code>. You can also just read ` +
      `<a href="${p.md}">the file</a> on GitHub.</p>`;
  }
}

window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || 'gdd');
</script>
</body>
</html>
