<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DAEMONWARE — FLOOR 01</title>
<style>
  :root{
    --void:#04050A; --cyan:#46F0DC; --gold:#E3B347;
    --shell:#8B5BF2; --blood:#D6402A; --bone:#E7E2D2;
    --edge:rgba(70,240,220,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--void); color:var(--bone);
    font:12px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    letter-spacing:.14em; overflow:hidden;
    touch-action:manipulation;              /* no double-tap zoom delay */
    -webkit-tap-highlight-color:transparent;
  }
  #app{height:100vh;display:grid;grid-template-rows:44px 1fr auto;min-height:0}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;border-bottom:1px solid var(--edge);
    background:linear-gradient(180deg,rgba(70,240,220,.05),transparent);
  }
  .brand{color:var(--cyan);font-size:13px;letter-spacing:.4em}
  .brand small{color:var(--bone);opacity:.4;letter-spacing:.25em;margin-left:12px}
  .turn{display:flex;align-items:baseline;gap:10px}
  .turn .lbl{opacity:.45;letter-spacing:.3em;font-size:10px}
  .turn .val{color:var(--gold);font-size:22px;letter-spacing:.1em}

  #body{display:grid;grid-template-columns:1fr 300px;min-height:0}
  #viewport{position:relative;min-width:0;min-height:0;padding:12px;display:flex}
  #stage{width:100%;height:100%;display:block;touch-action:none}

  aside{border-left:1px solid var(--edge);display:grid;
        grid-template-rows:1fr;min-height:0}

  /* ---- bottom HUD: party cards run the full width ---- */
  #hud{
    border-top:1px solid var(--edge);
    background:linear-gradient(0deg,rgba(70,240,220,.04),transparent);
    display:grid;grid-template-columns:1fr 300px;
    min-height:0;
  }
  #roster{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding:10px 12px;align-content:start;
  }
  .hud-side{
    border-left:1px solid var(--edge);
    padding:10px 14px;display:flex;flex-direction:column;gap:7px;
  }
  .hud-label{
    font-size:10px;letter-spacing:.34em;color:var(--cyan);opacity:.75;
    display:flex;justify-content:space-between;
  }
  .hud-label span{color:var(--gold);opacity:.9;letter-spacing:.2em}
  .keys{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:9px;opacity:.42;
        letter-spacing:.14em;margin-top:auto}
  .keys b{color:var(--cyan);font-weight:400}

  @media (max-width:900px){
    #body{grid-template-columns:1fr}
    aside{display:none}
    #hud{grid-template-columns:1fr}
    .hud-side{border-left:0;border-top:1px solid var(--edge)}
  }
  .block{padding:12px 14px;border-bottom:1px solid var(--edge)}
  h2{
    font-size:10px;font-weight:400;letter-spacing:.34em;
    color:var(--cyan);opacity:.75;margin-bottom:9px;
    display:flex;justify-content:space-between;
  }
  h2 span{color:var(--gold);opacity:.85;letter-spacing:.2em}

  /* ---- unit card ---- */
  .unit{
    --tint:var(--cyan);
    border:1px solid var(--edge);padding:8px 10px;
    background:rgba(70,240,220,.02);
    transition:border-color .2s ease,background .2s ease,opacity .2s ease;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .unit-head{display:flex;justify-content:space-between;align-items:baseline}
  .unit-name{letter-spacing:.2em;font-size:11px;color:var(--tint)}
  .unit-role{font-size:9px;opacity:.4;letter-spacing:.18em}

  /* ---- particles ---- */
  .p{
    position:absolute;width:3px;height:3px;pointer-events:none;
    animation:pburst var(--dur,.5s) cubic-bezier(.15,.72,.3,1) forwards;
  }
  @keyframes pburst{
    0%  {opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.35)}
  }
  .p-bone {background:var(--bone)}
  .p-gold {background:var(--gold)}
  .p-shell{background:var(--shell)}
  .p-blood{background:var(--blood)}
  .p-cyan {background:var(--cyan)}

  /* Sprite-strip FX. 8 frames horizontal; steps(8,jump-none) walks
     background-position through them. Transparency is baked into the
     strip PNGs (luminance-keyed alpha) — do NOT use mix-blend-mode here:
     #floaters is a stacking context, which isolates blending, so blend
     modes composite against nothing and the art renders opaque. */
  .fxsheet{
    position:absolute;pointer-events:none;
    transform:translate(-50%,-50%);
    background-repeat:no-repeat;background-size:800% 100%;
    animation:fxplay var(--dur,.5s) steps(8,jump-none) forwards;
  }
  @keyframes fxplay{
    from{background-position-x:0%;opacity:1}
    to  {background-position-x:100%;opacity:1}
  }

  .ring{
    position:absolute;pointer-events:none;border:1px solid var(--bone);
    border-radius:50%;transform:translate(-50%,-50%);
    animation:pring .5s cubic-bezier(.15,.72,.3,1) forwards;
  }
  @keyframes pring{
    0%  {width:8px;height:8px;opacity:.9}
    100%{width:var(--r);height:var(--r);opacity:0}
  }

  /* ---- floating combat / pickup text ---- */
  #floaters{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  .float{
    position:absolute;white-space:nowrap;
    font-size:11.5px;letter-spacing:.14em;opacity:0;
    text-shadow:0 0 5px rgba(4,5,10,.95),0 0 12px rgba(4,5,10,.85);
    animation:floatup 1.15s cubic-bezier(.22,.72,.3,1) forwards;
  }
  @keyframes floatup{
    0%  {opacity:0;transform:translate(-50%,-50%) translateY(7px)  scale(.82)}
    16% {opacity:1;transform:translate(-50%,-50%) translateY(0)    scale(1.08)}
    28% {opacity:1;transform:translate(-50%,-50%) translateY(-4px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) translateY(-42px) scale(1)}
  }
  .float.f-dmg   {color:var(--bone)}
  .float.f-hurt  {color:var(--blood);font-size:12.5px}
  .float.f-sever {color:var(--gold);font-size:10px;letter-spacing:.3em}
  .float.f-argent{color:var(--gold)}
  .float.f-flux  {color:var(--shell)}
  .float.f-data  {color:var(--cyan)}
  .float small{opacity:.6;font-size:8.5px;letter-spacing:.2em;margin-left:5px}

  /* ---- overlays: exit dialog + win screen ---- */
  .overlay{
    position:fixed;inset:0;z-index:30;display:none;
    align-items:center;justify-content:center;
    background:rgba(4,5,10,.82);backdrop-filter:blur(3px);
  }
  .overlay.open{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .dialog,.winbox{
    background:var(--void);border:1px solid var(--edge);
    padding:26px 30px;text-align:center;
    box-shadow:0 0 0 1px rgba(4,5,10,.9),0 20px 60px rgba(0,0,0,.75);
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    animation:rise .26s cubic-bezier(.16,.9,.24,1);
  }
  @keyframes rise{from{transform:translateY(12px) scale(.97);opacity:0}
                  to{transform:none;opacity:1}}

  .dlg-eyebrow{font-size:9px;letter-spacing:.4em;color:var(--cyan);opacity:.7;margin-bottom:12px}
  .dlg-title{font-size:14px;letter-spacing:.16em;color:var(--bone);line-height:1.6}
  .dlg-note{font-size:9.5px;letter-spacing:.16em;opacity:.45;margin-top:10px}
  .dlg-actions{display:flex;gap:12px;justify-content:center;margin-top:22px}
  .dlg-keys{font-size:9px;letter-spacing:.24em;opacity:.35;margin-top:14px}

  .box{
    font:inherit;letter-spacing:.28em;font-size:11px;cursor:pointer;
    padding:9px 26px;color:var(--bone);background:transparent;
    border:1px solid var(--edge);
    transition:background .15s ease,color .15s ease,border-color .15s ease;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .box:hover{background:rgba(70,240,220,.12)}
  .box.yes{border-color:var(--gold);color:var(--gold)}
  .box.yes:hover{background:rgba(227,179,71,.18)}
  .box.no{border-color:var(--edge)}

  .winbox{padding:44px 60px;border-color:var(--gold)}
  .win-title{
    font-size:34px;letter-spacing:.14em;color:var(--gold);line-height:1.2;
    text-shadow:0 0 22px rgba(227,179,71,.45);
  }
  .win-rule{height:1px;background:var(--gold);opacity:.5;margin:20px 0 18px}
  .win-stats{display:grid;gap:5px;font-size:10px;letter-spacing:.2em;
             opacity:.7;margin-bottom:26px}
  .win-stats div{display:flex;justify-content:space-between;gap:34px}
  .win-stats b{font-weight:400;color:var(--gold)}

  /* ---- interaction hint: small tag above the token ---- */
  #hint{
    position:absolute;z-index:4;pointer-events:none;
    padding:4px 8px;font-size:9.5px;letter-spacing:.2em;white-space:nowrap;
    color:var(--gold);background:rgba(4,5,10,.94);
    border:1px solid var(--gold);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    opacity:0;transform:translate(-50%,-100%) translateY(6px);
    transition:opacity .18s ease, transform .24s cubic-bezier(.16,.9,.24,1);
  }
  #hint.open{opacity:1;transform:translate(-50%,-100%) translateY(0);
             animation:hintbob 2.2s ease-in-out infinite}
  #hint.aim{color:var(--gold);border-color:var(--gold)}
  #hint.locked{color:var(--blood);border-color:var(--blood);animation:none}
  #hint.aim .k{border-color:var(--gold);color:var(--gold)}
  #hint .k{
    display:inline-block;min-width:13px;text-align:center;margin-right:5px;
    border:1px solid var(--gold);padding:0 3px;color:var(--gold);
  }
  @keyframes hintbob{0%,100%{margin-top:0}50%{margin-top:-3px}}

  /* ---- floating operations fan: hovers over the party token ---- */
  #fan{
    position:absolute;z-index:5;
    display:flex;gap:8px;align-items:flex-end;
    padding:8px 9px;
    background:rgba(4,5,10,.92);
    border:1px solid var(--edge);
    box-shadow:0 0 0 1px rgba(4,5,10,.9), 0 8px 28px rgba(0,0,0,.65);
    clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
    opacity:0;pointer-events:none;
    transform-origin:50% 100%;
    transform:translate(-50%,-100%) translateY(10px) scale(.97);
    transition:opacity .22s ease, transform .30s cubic-bezier(.16,.9,.24,1);
  }
  #fan.open{opacity:1;pointer-events:auto;transform:translate(-50%,-100%) translateY(0) scale(1)}
  #fan.below{transform-origin:50% 0%;transform:translate(-50%,0) translateY(-10px) scale(.97)}
  #fan.below.open{transform:translate(-50%,0) translateY(0) scale(1)}

  /* While aiming, the fan would sit on top of the enemies you need to click.
     Collapse it into the token and bring it back once the shot is taken. */
  #fan.open.aiming{
    opacity:0;pointer-events:none;
    transform:translate(-50%,-100%) translateY(16px) scale(.40);
  }
  #fan.below.open.aiming{
    transform:translate(-50%,0) translateY(-16px) scale(.40);
  }
  #fan.aiming .grp{transition-delay:0s}

  /* a tether line from the fan down to the token */
  #fan::after{
    content:'';position:absolute;left:50%;bottom:-9px;width:1px;height:9px;
    background:var(--edge);
  }
  #fan.below::after{bottom:auto;top:-9px}

  .grp{
    --tint:var(--cyan);
    display:grid;gap:3px;min-width:150px;align-content:start;
    opacity:0;transform:translateY(6px);
    transition:opacity .24s ease, transform .28s cubic-bezier(.16,.9,.24,1);
  }
  #fan.open .grp{opacity:1;transform:translateY(0)}
  #fan.open .grp:nth-child(2){transition-delay:.05s}
  #fan.open .grp:nth-child(3){transition-delay:.10s}

  .grp-name{
    font-size:9px;letter-spacing:.24em;color:var(--tint);
    border-bottom:1px solid var(--tint);padding-bottom:3px;margin-bottom:2px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .grp-name em{font-style:normal;font-size:8px;opacity:.5;letter-spacing:.12em}
  .grp.done{opacity:.28}
  .grp.done .grp-name{border-bottom-style:dashed}
  .grp.acting .grp-name{color:var(--gold);border-bottom-color:var(--gold)}

  .chip{
    display:grid;grid-template-columns:13px 1fr auto;gap:2px 6px;align-items:center;
    padding:5px 7px;cursor:pointer;font-size:10px;max-width:190px;
    border-left:2px solid var(--tint);
    background:rgba(231,226,210,.05);
    transition:background .14s ease, border-color .14s ease;
  }
  .chip:hover{background:rgba(70,240,220,.14)}
  .chip .hk{color:var(--tint);opacity:.75;font-size:9px}
  .chip .cn{letter-spacing:.14em;white-space:nowrap}
  .chip .cc{color:var(--shell);font-size:9px;letter-spacing:.06em}
  .chip .cnote{
    grid-column:2 / 4;font-size:8.5px;line-height:1.35;letter-spacing:.05em;
    opacity:.42;text-transform:none;transition:opacity .14s ease;
  }
  .chip:hover .cnote{opacity:.8}
  .chip.aiming .cnote{opacity:.85;color:var(--gold)}
  .chip.locked{opacity:.3;cursor:not-allowed;border-left-color:var(--bone)}
  .chip.locked:hover{background:rgba(231,226,210,.05)}
  .chip.locked .cc{color:var(--blood)}
  .chip.aiming{
    background:rgba(227,179,71,.2);border-left-color:var(--gold);
    box-shadow:inset 0 0 0 1px rgba(227,179,71,.4);
  }
  .chip.aiming .cn,.chip.aiming .hk{color:var(--gold)}

  /* a chip that is legal but has nothing to hit reads differently from one
     you simply cannot pay for */
  .chip.untargetable .cc{color:var(--bone);opacity:.7}

  @keyframes nudge{
    0%,100%{box-shadow:inset 0 0 0 1px rgba(227,179,71,.25)}
    50%    {box-shadow:inset 0 0 0 1px rgba(227,179,71,.9)}
  }

  .prompt.warn{color:var(--gold);opacity:1;border-color:var(--gold)}

  /* card states */
  .unit.acting{border-color:var(--gold);background:rgba(227,179,71,.08)}
  .unit.done{opacity:.4}
  .unit.severed{opacity:.28;border-color:var(--blood)}
  .unit.severed .unit-name{color:var(--blood);text-decoration:line-through}
  .unit.severed .vitae i{background:var(--blood)!important}

  /* ---- bars ---- */
  .bars{display:grid;gap:2px;margin-top:5px}
  .vitae,.pneuma{height:4px;background:rgba(231,226,210,.10);overflow:hidden}
  .pneuma{height:2.5px}
  .vitae i,.pneuma i{display:block;height:100%;background:var(--tint);
                     transition:width .25s cubic-bezier(.16,.9,.24,1)}
  .pneuma i{background:var(--shell)}
  .unit-meta{display:flex;justify-content:space-between;font-size:9.5px;opacity:.5;margin-top:4px}

  /* ---- effects + prompt ---- */
  .bag{display:flex;flex-wrap:wrap;gap:5px}
  .bg{font-size:9px;letter-spacing:.16em;padding:2px 6px;
      border:1px solid currentColor;opacity:.55}
  .bg b{font-weight:400;opacity:1}
  .bg.a{color:var(--gold)} .bg.f{color:var(--shell)} .bg.d{color:var(--cyan)}
  .bg.drop{color:var(--bone);border-style:dashed;opacity:.75}

  .effects{display:flex;flex-wrap:wrap;gap:5px}
  .eff{font-size:9px;letter-spacing:.16em;padding:2px 6px;
       border:1px solid var(--bone);color:var(--bone);opacity:.8}
  .eff b{color:var(--gold);font-weight:400}
  .eff.dim{border-color:var(--edge);opacity:.4}

  .prompt{font-size:9.5px;letter-spacing:.2em;opacity:.5;
          border-left:1px solid var(--edge);padding-left:8px;transition:color .2s,opacity .2s}
  .prompt.hot{color:var(--gold);opacity:1;border-color:var(--gold)}

  /* ---- log ---- */
  #logwrap{padding:12px 14px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  #log{flex:1;min-height:0;overflow-y:auto;font-size:10px;line-height:1.75;opacity:.7;
       display:flex;flex-direction:column}
  #log .line{border-left:1px solid var(--edge);padding-left:8px;margin-bottom:2px}
  #log .line.good{border-color:var(--gold);color:var(--gold)}
  #log .line.bad{border-color:var(--blood);color:var(--blood)}

  /* ---- COMMIT ROUND: bottom-centre of the map, just above the nameplates ---- */
  #confirm{
    position:absolute;left:50%;bottom:10px;z-index:5;
    transform:translateX(-50%) translateY(8px);
    min-height:44px;padding:0 22px;
    font:inherit;letter-spacing:.24em;font-size:10.5px;
    color:var(--bone);background:rgba(4,5,10,.92);
    border:1px solid var(--edge);cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .24s cubic-bezier(.16,.9,.24,1),
               color .2s ease, border-color .2s ease, background .2s ease;
  }
  #confirm.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  #confirm.ready{
    color:var(--gold);border-color:var(--gold);background:rgba(227,179,71,.14);
    animation:nudge 1.15s ease-in-out infinite;
  }

  /* touch devices need no keyboard legend */
  @media (pointer:coarse){ .keys{display:none} }

  /* landscape phones: reclaim vertical space for the map */
  @media (max-height:480px){
    #app{grid-template-rows:34px 1fr auto}
    .brand{font-size:11px}
    .turn .val{font-size:16px}
    #hud{grid-template-columns:1fr 220px}
    .hud-side{border-top:0;border-left:1px solid var(--edge);padding:6px 10px;gap:4px}
    #roster{padding:6px 10px;gap:6px}
    .unit{padding:5px 8px}
    .keys{display:none}
  }

  /* notched devices: keep the HUD and header out of the hardware insets */
  header{padding-left:max(16px, env(safe-area-inset-left));
         padding-right:max(16px, env(safe-area-inset-right))}
  #hud{padding-bottom:env(safe-area-inset-bottom);
       padding-left:env(safe-area-inset-left);
       padding-right:env(safe-area-inset-right)}

  @media (prefers-reduced-motion:reduce){
    #fan,.grp,.chip,.vitae i,.pneuma i,.unit,#hint{transition-duration:.01ms!important}
    #hint.open{animation:none}
    .overlay.open,.dialog,.winbox{animation:none}
    .float{animation-duration:.6s}
    .p,.ring,.fxsheet{animation-duration:.25s}
    #confirm.ready{animation:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">DAEMONWARE <small>FLOOR 01 // VERTICAL SLICE</small></div>
    <div class="turn"><span class="lbl">TURN</span><span class="val" id="turn-value">001</span></div>
  </header>

  <div id="body">
    <div id="viewport">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"
           preserveAspectRatio="xMidYMid meet"></svg>
      <div id="floaters"></div>
      <div id="fan" class="fan"></div>
      <div id="hint" class="hint"></div>
      <button id="confirm"></button>
    </div>

    <aside>
      <div id="logwrap">
        <h2>RECORD</h2>
        <div id="log"></div>
      </div>
    </aside>
  </div>

  <footer id="hud">
    <div id="roster"></div>
    <div class="hud-side">
      <div class="hud-label">CIRCLE <span id="threat"></span></div>
      <div id="bag" class="bag"></div>
      <div id="effects" class="effects"></div>
      <div id="prompt" class="prompt"></div>
      <div class="keys">
        <span><b>WASD</b> MOVE</span><span><b>E</b> ACT</span>
        <span><b>1-5</b> OPERATION</span><span><b>SPACE</b> COMMIT</span>
        <span><b>ESC</b> CANCEL</span>
      </div>
    </div>
  </footer>
</div>

<!-- exit confirmation -->
<div id="modal" class="overlay">
  <div class="dialog">
    <div class="dlg-eyebrow">DESCENT</div>
    <div class="dlg-title">Would you like to leave this floor?</div>
    <div id="dlg-note" class="dlg-note"></div>
    <div class="dlg-actions">
      <button class="box yes" data-answer="yes">YES</button>
      <button class="box no"  data-answer="no">NO</button>
    </div>
    <div class="dlg-keys">Y / N &middot; ESC CANCELS</div>
  </div>
</div>

<!-- win screen -->
<div id="win" class="overlay">
  <div class="winbox">
    <div class="win-title">YOU'RE WINNER!!!</div>
    <div class="win-rule"></div>
    <div id="win-stats" class="win-stats"></div>
    <button class="box" id="again">RECOMPILE</button>
  </div>
</div>

<script src="data/floor01.js?v=1cc60384"></script>
<script src="data/balance.js?v=1cc60384"></script>
<script src="data/fxsheets.js?v=1cc60384"></script>
<script src="src/sprites.js?v=1cc60384"></script>
<script src="src/game.js?v=1cc60384"></script>
</body>
</html>
